name: Cloudflare IP ranges

# The API trusts CF-Connecting-IP only from Cloudflare's published ranges
# (backend/libs/users/constants.py). This fails, and GitHub emails, when they change.
on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev
      - run: uv run python -m scripts.check_cloudflare_ips
