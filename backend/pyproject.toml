[project]
name = "persona-blog-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.6.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "google-auth>=2.58.0",
    "granian>=2.8.2",
    "httpx>=0.28.1",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-redis>=0.5.2",
    "markdown-it-py>=4.2.0",
    "openai>=3.16.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "sqlparse>=0.6.0",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# D101-D103: every public class, method and function has a docstring
select = ["E", "W", "F", "I", "UP", "B", "ASYNC", "N", "SIM", "RUF", "TID", "D101", "D102", "D103"]
# python-naming.md suffixes exceptions with Exception, not Error
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# Revision filenames start with a timestamp, which isn't a valid module name
"migrations/revisions/*.py" = ["N999", "D101", "D102", "D103"]
# Shapes and declarations whose names say what they are
"tests/**/*.py" = ["D101", "D102", "D103"]
"migrations/env.py" = ["D101", "D102", "D103"]
"**/__init__.py" = ["D101", "D102", "D103"]
"**/dtos.py" = ["D101", "D102", "D103"]
"**/results.py" = ["D101", "D102", "D103"]
"**/inputs.py" = ["D101", "D102", "D103"]
"**/settings.py" = ["D101", "D102", "D103"]
"**/types.py" = ["D101", "D102", "D103"]
"**/exceptions.py" = ["D101", "D102", "D103"]
"libs/database/orm/*.py" = ["D101", "D102", "D103"]

[tool.ruff.lint.pep8-naming]
# SQLAlchemy's declared_attr methods receive the class
classmethod-decorators = ["sqlalchemy.orm.declared_attr"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "-m", "not live_llm and not migration"]
strict = true
filterwarnings = ["error"]
markers = [
    "live_llm: calls the real LLM provider; run by hand with -m live_llm",
    "migration: rebuilds the test database schema; run with -m migration",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
